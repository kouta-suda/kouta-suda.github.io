<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">

<script>
const AUTH_KEY="shift-auth",AUTH_MS=3600000;let EXP=0;
const okSession=()=>{let t=0;try{t=+localStorage.getItem(AUTH_KEY)||0}catch(e){}return Math.max(t,EXP)>Date.now()};
if(!okSession())document.documentElement.classList.add("locked");
</script>
<style>
:root{--bg:#f3f5fb;--fg:#1f2937;--card:#ffffff;--ac:#4f46e5;--ac2:#0ea5e9;--bd:#e2e6f0;--mut:#6b7280;--bub:#d4f4c8;--bubfg:#14301a;--shadow:0 1px 3px rgba(30,41,90,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--fg:#e8ecf5;--card:#1b2437;--ac:#818cf8;--ac2:#38bdf8;--bd:#2e3a52;--mut:#94a3b8;--bub:#1f5130;--bubfg:#e6f7e9;--shadow:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f172a;--fg:#e8ecf5;--card:#1b2437;--ac:#818cf8;--ac2:#38bdf8;--bd:#2e3a52;--mut:#94a3b8;--bub:#1f5130;--bubfg:#e6f7e9;--shadow:0 1px 3px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding:12px 12px 40px;max-width:640px}
header{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;padding:16px 18px;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 14px rgba(79,70,229,.25)}
header h1{margin:0;font-size:21px;letter-spacing:.04em}header span{font-size:14px;opacity:.9;background:rgba(255,255,255,.22);padding:1px 10px;border-radius:12px}
input,select,button,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
button{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:600;padding:8px 14px;cursor:pointer;box-shadow:var(--shadow)}
button:active{transform:scale(.96)}
#rst,button[data-res],[data-ovr]{background:transparent;color:var(--ac);border:1px solid var(--ac);box-shadow:none}
button[data-del]{background:#ef4444!important;padding:6px 11px}
#d{font-weight:700;font-size:18px}
.row{display:flex;gap:6px;margin:6px 0;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:8px 0;box-shadow:var(--shadow)}
#rows .card{border-left:5px solid var(--ac2)}#rows .card.emp{border-left-color:#f59e0b}
#rows .card .row{margin:4px 0}
.p{flex:1 1 60px;width:60px}.t{width:64px}.n{flex:1 1 90px;width:90px}
#pos>div{padding:3px 0;border-bottom:1px dashed var(--bd)}#pos>div:last-child{border-bottom:0}
#pos input[type=number]{background:var(--card)}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:8px 0;box-shadow:var(--shadow)}
summary{cursor:pointer;font-weight:600;color:var(--ac)}
pre{background:var(--bub);color:var(--bubfg);padding:14px 16px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;overflow-x:auto;font:15px/1.6 ui-monospace,"Noto Sans Mono CJK JP",Menlo,monospace;box-shadow:var(--shadow)}
h3{margin:24px 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:5px;height:17px;border-radius:3px;background:linear-gradient(var(--ac),var(--ac2))}
small{color:var(--mut)}
label{display:inline-flex;align-items:center;gap:4px}
.chip{padding:4px 12px;font-size:14px;border-radius:16px}
.chip.on{background:var(--ac);color:#fff;border:0}
.chip.off{background:transparent;color:var(--fg);border:1px solid var(--bd);box-shadow:none;font-weight:400}

main{display:none}main.on{display:block}
body{padding-bottom:96px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(30,41,90,.08);z-index:9}
#nav button{flex:1;background:none;color:var(--mut);box-shadow:none;border-radius:10px;font-size:11px;font-weight:600;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
#nav button b{font-size:20px;font-weight:400}#nav button.on{color:var(--ac);background:var(--bg)}
.ghost{background:transparent!important;color:var(--ac);border:1px solid var(--ac);box-shadow:none}
.del{background:#ef4444!important;padding:6px 11px}

#gate{display:none;position:fixed;inset:0;z-index:99;background:var(--bg);align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
html.locked #gate{display:flex}
html.locked body>*:not(#gate){display:none!important}
.gbox{width:100%;max-width:300px;text-align:center}
.gbox h2{margin:0 0 6px}.gbox p{margin:0 0 18px;color:var(--mut)}
#pin,#pinbtn{display:block;box-sizing:border-box;width:100%;max-width:200px;margin:0 auto}
#pin{margin-bottom:14px;font-size:24px;letter-spacing:.4em;text-align:center;padding:9px 0 9px .4em}
#pinbtn{padding:10px;font-size:16px}
#pinmsg{display:block;margin-top:12px;min-height:1.4em;color:#dc2626}

/* ---- 簡略レイアウト(人数カウント版) ---- */
:root{--okfg:#15803d;--lobg:#fee2e2;--lofg:#b91c1c;--hibg:#fef3c7;--hifg:#92400e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--okfg:#4ade80;--lobg:#4a1d1d;--lofg:#fca5a5;--hibg:#43310f;--hifg:#fcd34d}}
:root[data-theme="dark"]{--okfg:#4ade80;--lobg:#4a1d1d;--lofg:#fca5a5;--hibg:#43310f;--hifg:#fcd34d}
header{padding:10px 16px;margin:0 0 10px;border-radius:14px}
header h1{font-size:18px}
details{padding:8px 12px;margin:6px 0}
details.sub{background:none;border:0;border-top:1px dashed var(--bd);border-radius:0;box-shadow:none;padding:6px 0 0;margin:6px 0 0}
summary{font-size:14px}
.top select{flex:1 1 0}
#d{font-size:16px}
.btnl{display:inline-block;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:15px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.bd{font-size:13px;font-weight:700;padding:3px 10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);white-space:nowrap}
.bd.ok{color:var(--okfg);border-color:var(--okfg)}
.bd.lo{background:var(--lobg);color:var(--lofg);border-color:var(--lofg)}
.bd.hi{background:var(--hibg);color:var(--hifg);border-color:var(--hifg)}
.pr{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ac2);border-radius:12px;margin:6px 0;box-shadow:var(--shadow)}
.pr.open{border-color:var(--ac)}
.pr.emp{border-left-color:#f59e0b}
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,auto);gap:10px;align-items:center;padding:9px 12px;cursor:pointer}
.pn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt{color:var(--mut);font-variant-numeric:tabular-nums}
.pp{color:var(--ac);font-weight:700;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pe{padding:2px 12px 10px;border-top:1px dashed var(--bd)}
.empty{padding:14px;text-align:center;color:var(--mut)}
.drow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.inp{padding:6px 12px}
</style></head>
<body>
<div id="gate"><div class="gbox"><h2>シフト作成</h2><p>4桁の番号を入力してください</p><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="4桁の番号"><button id="pinbtn">開く</button><small id="pinmsg"></small></div></div>
<header><h1 id="ttl">シフト作成</h1><span id="sn"></span></header>
<main id="v1" class="on">
<div class="row top"><select id="st"></select><select id="d"></select><label><input type="checkbox" id="hol"> 祝日</label></div>
<details id="ld"><summary id="lds">Excelを読み込む</summary>
<div class="row"><select id="mm"></select><select id="hf"><option>前半</option><option>後半</option></select></div>
<div class="row"><button id="od">OneDriveから読み込む</button><label class="btnl ghost">ファイルを選ぶ<input type="file" id="f" hidden accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label></div>
<div class="row"><select id="sh" style="display:none;flex:1"></select></div>
<small id="msg">月と前半・後半を選んで、Excelを読み込んでください</small>
</details>
<div id="pos" class="badges"></div>
<div id="rows"></div>
<div class="row"><button id="add">＋ 人を追加</button></div>
<details id="dd"><summary>削除した人 <span id="dn"></span></summary><div id="del"></div><div class="row"><button id="rst" class="ghost">この日をExcelの内容に戻す</button></div></details>
<div class="card inp"><div class="row">予約 <input id="g" type="number" class="t" placeholder="組" inputmode="numeric">組 <input id="pp" type="number" class="t" placeholder="名" inputmode="numeric">名 売上 <input id="tg" type="number" style="flex:1 1 90px" placeholder="円" inputmode="numeric"></div>
<div class="row"><input id="nt" style="flex:1" placeholder="備考(任意)"></div></div>
<h3>出力</h3><pre id="out"></pre>
<div class="row"><button id="cp">コピー</button><small id="lb"></small></div>
</main>
<main id="v2"><h3>人件費累計</h3><div class="card"><small>準備中です</small></div></main>
<main id="v3"></main>
<main id="v4"><h3>その他</h3><div class="card"><small>準備中です</small></div></main>
<nav id="nav"><button data-n="1" class="on"><b>📋</b>シフト作成</button><button data-n="2"><b>💴</b>人件費累計</button><button data-n="3"><b>⚙️</b>登録情報確認・編集</button><button data-n="4"><b>…</b>その他</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KEY="shift-s2",WD="日月火水木金土",$=i=>document.getElementById(i);
const P=(n,role,parent,kw,wk,fs,sat,ab)=>({n,role,parent,kw,wk,fs,sat,ab});
const SEED=()=>({id:1,name:"店舗1",wage:0,daily:0,dv:3,emps:[],pos:[],skill:{},days:{},cur:null});
let S=null,WB,cur=null,armed=false;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.stores)S={stores:[SEED()],cs:1};
S.stores.forEach(T=>T.pos.forEach(p=>{if(p.ab===undefined)p.ab=p.n==="ホール"?"ホ":""}));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ST=()=>S.stores.find(x=>x.id===S.cs)||S.stores[0];
const DY=()=>ST().days;
const setCur=k=>{cur=k;ST().cur=k};
const dtype=D=>D.wd==="土"?"sat":(D.hol||D.wd==="金"||D.wd==="日")?"fs":"wk";
const kws=p=>[p.n,...String(p.kw||"").split(/[,、\s]+/)].filter(Boolean);
const num=x=>String(+x);
const wid=s=>[...s].reduce((a,c)=>a+(c.charCodeAt(0)>255?2:1),0);
const pad=(s,w)=>s+" ".repeat(Math.max(w-wid(s),0));
const prep=t=>(t||"").normalize("NFKC").replace(/(\d)[.,、・](\d)階/g,"$1階$2階");
const setP=(o,path,v)=>{const k=path.split(".");let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v};
function ensure(r){if(r.ps)return;const T=ST(),t=prep(r.p),f=[];
  T.pos.forEach(p=>{const ix=Math.min(...kws(p).map(k=>{const j=t.indexOf(k);return j<0?1e9:j}));if(ix<1e9)f.push([ix,p.n])});
  f.sort((a,b)=>a[0]-b[0]);r.ps=f.map(x=>x[1]);r.x=r.ps.length?"":(r.p||"")}
const posTxt=r=>{ensure(r);const ab=n=>{const q=ST().pos.find(p=>p.n===n);return q?(q.ab!==undefined?q.ab:(n==="ホール"?"ホ":""))||n:n};
  return[r.ps.length>1?r.ps.map(ab).join(""):r.ps.join(""),r.x].filter(Boolean).join(" ")};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let OPEN=null;
const REGOPEN=new Set();
const kid=r=>r.k||(r.k=Math.random().toString(36).slice(2,8));
const sortRows=D=>{D.rows.sort((a,b)=>a.s-b.s)};
const cnt=(p,t)=>{const v=p["c"+t];return v===undefined||v===null?(p[t]!=null?"1":""):String(v)};
function rng(p,t){const s=cnt(p,t).normalize("NFKC").replace(/[~〜～ー–—－]/g,"-").replace(/\s+/g,"");
  if(s==="")return null;const m=s.match(/^(\d+)(?:-(\d+))?$/);if(!m)return null;
  const a=+m[1],b=m[2]!==undefined?+m[2]:a;
  if(m[2]===undefined&&a===0)return{lo:0,hi:Infinity};
  return{lo:Math.min(a,b),hi:Math.max(a,b)}}
function avail(T,t){return T.pos.filter(p=>p.n&&rng(p,t)&&!(p.role==="parent"&&T.pos.some(c=>c.role==="child"&&c.parent===p.n&&rng(c,t))))}
function chips(r,k){ensure(r);
  return `<div class="row">`+avail(ST(),dtype(DY()[cur])).map(p=>{const i=r.ps.indexOf(p.n);
    return `<button class="chip ${i>=0?"on":"off"}" data-r="${k}" data-c="${esc(p.n)}">${esc(p.n)}${i>=0&&r.ps.length>1?("①②③④⑤⑥⑦⑧⑨"[i]||""):""}</button>`}).join("")+`</div>`}
function rowHTML(r){const k=kid(r),open=OPEN===k,emp=ST().emps.some(e=>e.n&&e.n===r.n);ensure(r);
  return `<div class="pr${emp?" emp":""}${open?" open":""}" data-key="${k}"><div class="ph" data-tog="${k}"><span class="pn">${esc(r.n)||"（名前未入力）"}</span><span class="pt">${num(r.s)}-${num(r.e)}</span><span class="pp">${esc(posTxt(r))}</span></div>`+
  (open?`<div class="pe"><div class="row"><input class="n" placeholder="名前" value="${esc(r.n)}" data-r="${k}" data-f="n"><input class="t" type="number" step="0.5" inputmode="decimal" value="${r.s}" data-r="${k}" data-f="s"> 〜 <input class="t" type="number" step="0.5" inputmode="decimal" value="${r.e}" data-r="${k}" data-f="e"></div>${chips(r,k)}<div class="row"><input style="flex:1 1 120px" placeholder="その他（自由記述）" value="${esc(r.x)}" data-r="${k}" data-f="x"><button class="del" data-delr="${k}">外す</button><button class="ghost" data-tog="${k}">閉じる</button></div></div>`:"")+`</div>`}
function board(rows,D){const T=ST(),t=dtype(D);
  if(!T.pos.length)return "<small>登録情報でポジションを登録すると、ここに人数が出ます</small>";
  rows.forEach(r=>ensure(r));
  return avail(T,t).map(p=>{const g=rng(p,t),c=rows.filter(r=>r.ps.includes(p.n)).length,lo=c<g.lo,hi=c>g.hi,
    std=g.hi===Infinity?"":"/"+(g.lo===g.hi?g.lo:g.lo+"-"+g.hi);
    return `<span class="bd ${lo?"lo":hi?"hi":"ok"}">${lo?"⚠ ":hi?"▲ ":""}${esc(p.n)} ${c}${std}</span>`}).join("")}
function toggleRow(k){const D=DY()[cur];if(!D)return;OPEN=OPEN===k?null:k;sortRows(D);save();draw();
  const el=OPEN?document.querySelector('.pr[data-key="'+k+'"]'):null;if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"})}
const msg=t=>{$("msg").textContent=t;$("ld").open=true};
const nz=s=>(s||"").normalize("NFKC").replace(/\s+/g,"");
function load(buf){WB=XLSX.read(buf,{type:"array",cellDates:true});pick()}
function pick(){const N=WB.SheetNames,m=$("mm").value,hf=$("hf").value,sh=$("sh"),sn=nz(ST().name);
  const c=N.filter(n=>new RegExp("(^|\\D)"+m+"月"+hf).test(nz(n)));
  const mine=c.filter(n=>sn&&nz(n).includes(sn)),plain=c.filter(n=>new RegExp("^"+m+"月"+hf).test(nz(n)));
  const use=mine.length?mine:plain;
  sh.innerHTML=N.map(n=>`<option>${n}</option>`).join("");sh.style.display=N.length>1?"":"none";
  if(use.length){sh.value=use[0];parse();if(use.length>1)msg($("msg").textContent+"(同じ名前に当てはまるシートが"+use.length+"枚あります。上の選択で切り替えられます)")}
  else if(c.length){sh.value=c[0];msg("「"+m+"月"+hf+"」に当てはまるシートは、別の名前が付いたものだけでした("+c.join("、")+")。この店舗のシートか確認して、上の選択から選んでください")}
  else{msg("「"+m+"月"+hf+"」に当てはまるシートがありません。上の選択から直接選べます")}}
function parse(){const ws=WB.Sheets[$("sh").value],a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}),days={};
  (a[0]||[]).forEach((v,c)=>{if(!(v instanceof Date))return;
    const d=new Date(v.getTime()+12*36e5),k=(d.getUTCMonth()+1)+"/"+d.getUTCDate(),rows=[];
    for(let r=8;r<a.length;r++){const n=a[r][1],s=a[r][c],e=a[r][c+1];
      if(!n||n==="ホール"||n==="キッチン"||typeof s!=="number"||typeof e!=="number")continue;rows.push({n:String(n).trim(),s,e,ps:[],x:""})}
    rows.sort((x,y)=>x.s-y.s);const tg=parseInt(String(a[2]&&a[2][c]||"").replace(/,/g,""))||"";
    days[k]={wd:WD[d.getUTCDay()],rows,g:"",pp:"",tg,nt:"",orig:JSON.stringify({rows,tg})}});
  if(!Object.keys(days).length){msg("「"+$("sh").value+"」に日付の行が見つかりません");return}
  ST().days=days;ST().src=$("sh").value;OPEN=null;setCur(Object.keys(days)[0]);save();$("msg").textContent=$("sh").value+": "+Object.keys(days).length+"日分を読み込みました";init()}
function fillStores(){const o=S.stores.map(s=>`<option value="${s.id}" ${s.id===S.cs?"selected":""}>${s.name}</option>`).join("");
  $("st").innerHTML=o;if($("rs"))$("rs").innerHTML=o;$("sn").textContent=ST().name}
function switchStore(id){S.cs=id;cur=ST().cur;save();fillStores();init();renderReg()}
function init(){const T=ST(),k=Object.keys(DY());if(!cur||!DY()[cur])setCur(k[0]||null);
  $("d").innerHTML=k.map(x=>`<option value="${x}" ${x===cur?"selected":""}>${x}(${DY()[x].wd})</option>`).join("");
  $("lds").textContent=k.length?`${T.src||"読み込み済み"}・${k.length}日分`:"Excelを読み込む";
  $("ld").open=!k.length;draw()}
function draw(){const D=DY()[cur];
  if(!D){["rows","pos","del"].forEach(i=>$(i).innerHTML="");$("out").textContent="";$("lb").textContent="";$("dn").textContent="";return}
  D.del=D.del||[];$("hol").checked=!!D.hol;
  $("rows").innerHTML=D.rows.map(rowHTML).join("")||'<div class="empty">人員がいません。「＋ 人を追加」で入れてください</div>';
  $("dn").textContent=D.del.length?`(${D.del.length})`:"";
  $("del").innerHTML=D.del.map((r,i)=>`<div class="drow"><span>${esc(r.n)||"（名前未入力）"} ${num(r.s)}-${num(r.e)} ${esc(posTxt(r))}</span><button class="ghost" data-res="${i}">戻す</button></div>`).join("")||"<small>なし</small>";
  $("g").value=D.g;$("pp").value=D.pp;$("tg").value=D.tg;$("nt").value=D.nt;out()}
function out(){const T=ST(),D=DY()[cur];if(!D)return;
  const rows=[...D.rows].sort((x,y)=>x.s-y.s),nw=Math.max(8,...rows.map(r=>wid(r.n)))+2,wage=+T.wage||0;
  let h=0,labor=+T.daily||0;const L=[`${cur}(${D.wd})  ${T.name}`];
  rows.forEach(r=>{const w=r.e-r.s,e=T.emps.find(x=>x.n===r.n);if(e)labor+=+e.v;else{h+=w;labor+=w*wage}
